        /* Reprend le rendu du footer Flask (styles.css footer/.footer-container/.footer-bar),
            en autonome car la page docs FastAPI ne charge pas styles.css de Flask. */
        .api-footer {
            padding-top: 2rem;
            padding-bottom: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border-top: 1px solid #dee2e6; /* équivalent .border-top de Bootstrap */
            font-size: 80%;
        }
        .api-footer .footer-container {
            display: flex;
            justify-content: center;
            flex-direction: column;
            padding: 0;
            margin: 0;
        }
        .api-footer .footer-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .api-footer .footer-bar a { color: #0d6efd; text-decoration: none; }
        .api-footer .footer-bar a:hover { text-decoration: underline; }
        @media (max-width: 1250px) {
            .api-footer .footer-bar { flex-direction: column; gap: 30px; }
        }
        </style>
