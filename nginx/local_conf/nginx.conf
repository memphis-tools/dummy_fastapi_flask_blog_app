upstream backend {
  server fastapi:8000;
}

upstream frontend {
  server flask_front:8001;
}

server {
    listen 80;
    listen [::]:80;
    server_name dummy-ops.dev www.dummy-ops.dev;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CSP headers (1 line)
    add_header Content-Security-Policy "default-src 'self' https://cdn.consentmanager.net; script-src 'self' 'unsafe-inline' https://localhost https://cdn.consentmanager.net https://b.delivery.consentmanager.net https://pagead2.googlesyndication.com https://*.adtrafficquality.google https://js.hcaptcha.com https://www.googletagmanager.com https://www.google-analytics.com https://incidents.betterstack.com https://cdn-cgi.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.consentmanager.net; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://cdn.consentmanager.net https://b.delivery.consentmanager.net https://newassets.hcaptcha.com https://pagead2.googlesyndication.com; img-src 'self' data: https://www.cnam.fr https://frontends.udemycdn.com https://www.stationx.net https://realpython.com https://testdriven.io https://www.elephorm.com https://korben.info https://www.phoenixjp.info https://osintfr.com https://haveibeenpwned.com https://web-platforms.sfo2.cdn.digitaloceanspaces.com https://pagead2.googlesyndication.com https://raw.githubusercontent.com https://image.cnbcfm.com https://thehackernews.com https://blogger.googleusercontent.com https://www.securityweek.com https://local-ai-zone.github.io https://www.cisa.gov https://incidents.betterstack.com https://cdn.consentmanager.net https://b.delivery.consentmanager.net https://imgs3.hcaptcha.com; child-src 'self' https://cdn.consentmanager.net https://b.delivery.consentmanager.net; connect-src 'self' https://*.w.hcaptcha.com https://*.consentmanager.net https://cloudflareinsights.com https://ep1.adtrafficquality.google https://incidents.betterstack.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; frame-ancestors 'none';" always;

    location / {
        proxy_pass $scheme://frontend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_buffering off;
        client_max_body_size 5M;
    }

    location /api/v1/ {
	      proxy_pass $scheme://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_buffering off;
        client_max_body_size 5M;
    }

    location /static/ {
        alias /home/dummy-operator/flask/staticfiles/;
        autoindex off;
    }

}
